<!DOCTYPE html>
<!--
  App: Digital Signage Player
  Version: 0.2.1
  Note: Ensure version matches the 'version' field in manifest.json and update.xml.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BPS14 Chrome Sign Builder</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Roboto, sans-serif;
    }
    #status-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 1.5rem;
      text-align: center;
      z-index: 10;
    }
    .signage-frame {
      border: none;
      position: absolute;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="status-message">Awaiting JSON configuration. Please add the policy payload in Google Admin. Current Version 0.2.1</div>
  <div id="signage-container"></div>

  <script src="player.js"></script>
</body>
</html>
